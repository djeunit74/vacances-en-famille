<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><title>Jeux en voiture</title><style>:root{font-family:system-ui,sans-serif;background:linear-gradient(160deg,#dbeafe,#fde68a);color:#123;min-height:100%}*{box-sizing:border-box}body{margin:0}main{max-width:560px;margin:auto;padding:14px}.card{background:#fff;border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 8px 24px #0002}h1{text-align:center;margin:4px 0}.scores,.winnerGrid,.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.scorebox{text-align:center;background:#f8fafc;border-radius:14px;padding:9px}.scorebox b{display:block}.score{font-size:27px;font-weight:900}button{font:inherit;border:0;border-radius:15px;min-height:52px;padding:12px;font-weight:850;background:#2563eb;color:#fff}.alt{background:#f59e0b;color:#321}.reset{width:100%;margin-top:9px;background:#dc4c4c}.q{font-size:24px;font-weight:900;line-height:1.15}.tag{font-weight:850;color:#1d4ed8}.winnerTitle{font-size:21px;font-weight:950;text-align:center;margin:16px 0 9px}.winnerBtn{background:#0f9f55}.success{display:none;background:#dcfce7;border:2px solid #4ade80;border-radius:16px;padding:14px;text-align:center;font-weight:950;font-size:19px;margin-top:12px}.small{font-size:12px;color:#567}.back{display:block;text-align:center;text-decoration:none;background:#fff;color:#123;font-weight:800;padding:13px;border-radius:15px;margin-top:12px}</style></head><body><main><h1>🚗 Jeux en voiture</h1><div class="card"><div id="scores" class="scores"></div><button id="reset" class="reset">🔄 Nouvelle partie · scores à 0</button></div><div class="card"><div id="type" class="tag"></div><p id="challenge" class="q"></p><div class="winnerTitle">🏆 Qui a gagné ?</div><div id="winnerBtns" class="winnerGrid"></div><button id="skip" class="alt" style="width:100%;margin-top:9px">⏭️ Personne · défi suivant</button><div id="success" class="success"></div></div><div class="grid"><button id="spot">👀 Premier qui voit…</button><button id="words" class="alt">🧠 Jeu de mots</button></div><a class="back" href="jeux.html">← Jeux en famille</a><p class="small">Jeu destiné aux passagers. Le conducteur ne doit pas manipuler le téléphone ni participer à des défis qui détournent son attention.</p></main><script>
const fixed=[
['Premier qui voit une voiture rouge.',2,'Observation'],['Premier qui voit un camion.',1,'Observation'],['Premier qui voit une moto.',1,'Observation'],['Premier qui voit un panneau triangulaire.',1,'Observation'],['Premier qui voit une voiture jaune.',3,'Observation'],['Premier qui voit un tunnel.',2,'Observation'],['Premier qui voit une station-service.',1,'Observation'],['Premier qui voit un camping-car.',2,'Observation'],['Premier qui voit un pont.',2,'Observation'],['Premier qui voit un vélo.',1,'Observation'],['Premier qui voit un panneau bleu.',1,'Observation'],['Premier qui voit une aire de repos.',1,'Observation'],['Premier qui voit un drapeau.',2,'Observation'],['Premier qui voit un véhicule vert.',2,'Observation'],['Premier qui voit des vaches, moutons ou chevaux.',2,'Observation'],['Trouve une plaque contenant le chiffre 7.',2,'Observation'],['Trouve une plaque avec deux chiffres identiques.',2,'Observation'],['Trouve une plaque avec une lettre répétée.',2,'Observation'],['Trouve un panneau contenant la lettre A.',1,'Observation'],['Trouve un panneau indiquant une distance.',1,'Observation'],['Cite 5 marques de voitures.',2,'Rapidité'],['Cite 5 villes françaises.',2,'Culture'],['Cite 5 animaux marins.',2,'Culture'],['Cite 4 capitales européennes.',3,'Culture'],['Cite 5 sports.',2,'Rapidité'],['Cite 5 fruits sans dire pomme ni banane.',2,'Rapidité'],['Cite 5 métiers.',2,'Rapidité'],['Cite 5 choses qu’on emporte en vacances.',2,'Rapidité'],['Cite 5 pays dont le nom contient A.',3,'Culture'],['Cite 5 personnages de dessins animés.',2,'Culture'],['Fais deviner un animal en 3 indices.',2,'Devinette'],['Fais deviner un film en 3 indices.',2,'Devinette'],['Fais deviner une ville française en 3 indices.',3,'Devinette'],['Fais deviner un sport en 3 indices.',2,'Devinette'],['Invente une histoire avec route, dragon et glace.',2,'Créatif'],['Invente un nom drôle pour une station-service.',2,'Créatif'],['Invente une publicité pour votre voiture.',2,'Créatif'],['Invente une destination de vacances imaginaire.',3,'Créatif'],['Fais deviner une chanson en la fredonnant.',2,'Musique'],['Donne 3 mots anglais liés au voyage.',2,'Anglais']];
const letters='ABCDEFGHJKLMNPRSTV'.split('');const themes=['animaux','pays','villes','aliments','sports','métiers','objets de la maison','choses de vacances','prénoms','dessins animés'];
let generated=[];for(const l of letters){generated.push(['Cite 4 mots commençant par '+l+'.',2,'Mots']);generated.push(['Premier qui voit la lettre '+l+' sur un panneau ou une plaque.',1,'Observation'])}for(const t of themes){generated.push(['Cite 5 '+t+' en moins de 15 secondes.',2,'Rapidité']);generated.push(['À tour de rôle, citez des '+t+'. Le premier qui bloque perd.',3,'Duel'])}const challenges=fixed.concat(generated);
let state=JSON.parse(localStorage.getItem('plage4')||'null')||{players:[{name:'Joueur 1',score:0},{name:'Joueur 2',score:0},{name:'Joueur 3',score:0},{name:'Joueur 4',score:0}]};state.players=state.players.slice(0,4);if(!state.players.length)state.players=[{name:'Joueur 1',score:0}];let current=null,locked=false,last=-1;
function save(){localStorage.setItem('plage4',JSON.stringify(state));renderScores()}
function renderScores(){let order=state.players.map((p,i)=>({p,i})).sort((a,b)=>(b.p.score||0)-(a.p.score||0));scores.innerHTML=order.map((x,r)=>'<div class="scorebox"><b>'+['🥇','🥈','🥉','🏅'][r]+' '+x.p.name+'</b><span class="score">'+(x.p.score||0)+'</span></div>').join('')}
function renderWinnerButtons(){winnerBtns.innerHTML='';state.players.forEach((p,i)=>{let b=document.createElement('button');b.className='winnerBtn';b.textContent='🏆 '+p.name;b.onclick=()=>award(i);winnerBtns.appendChild(b)})}
function choose(filter){let pool=filter?challenges.filter(x=>x[2]===filter):challenges;let idx=Math.floor(Math.random()*pool.length);current=pool[idx];locked=false;success.style.display='none';winnerBtns.style.display='grid';skip.style.display='block';challenge.textContent=current[0];type.textContent=current[2]+' · +'+current[1]+' point'+(current[1]>1?'s':'')+' au gagnant'}
function award(i){if(locked)return;locked=true;state.players[i].score=(state.players[i].score||0)+current[1];save();success.textContent='✅ '+state.players[i].name+' gagne +'+current[1]+' point'+(current[1]>1?'s':'')+' · Total : '+state.players[i].score;success.style.display='block';winnerBtns.style.display='none';skip.style.display='none';if(navigator.vibrate)navigator.vibrate([80,40,80]);setTimeout(()=>choose(),1300)}
skip.onclick=()=>choose();spot.onclick=()=>choose('Observation');words.onclick=()=>choose('Mots');reset.onclick=()=>{if(confirm('Remettre les scores de tous les joueurs à 0 ?')){state.players.forEach(p=>p.score=0);save();choose()}};renderScores();renderWinnerButtons();choose();
</script></body></html>
