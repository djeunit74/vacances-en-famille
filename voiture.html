<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><title>Jeux en voiture</title><style>:root{font-family:system-ui,sans-serif;background:linear-gradient(160deg,#dbeafe,#fde68a);color:#123;min-height:100%}*{box-sizing:border-box}body{margin:0;min-height:100vh}main{max-width:560px;margin:auto;padding:16px}.card{background:#fff;border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 8px 24px #0002}h1{text-align:center;margin:4px 0 10px}.players,.scores,.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.player{background:#eff6ff;color:#123;border:2px solid #bfdbfe}.player.sel{background:#2563eb;color:#fff}.scorebox{text-align:center;background:#f8fafc;border-radius:14px;padding:9px}.scorebox b{display:block}.score{font-size:27px;font-weight:900}button{font:inherit;border:0;border-radius:15px;min-height:50px;padding:12px;font-weight:800;background:#2563eb;color:#fff}.alt{background:#f59e0b;color:#321}.reset{width:100%;margin-top:9px;background:#dc4c4c}.q{font-size:22px;font-weight:850}.tag{font-weight:800;color:#1d4ed8}.success{display:none;background:#dcfce7;border:2px solid #4ade80;border-radius:16px;padding:12px;text-align:center;font-weight:900;font-size:18px}.small{font-size:12px;color:#567}.back{display:block;text-align:center;text-decoration:none;background:#fff;color:#123;font-weight:800;padding:13px;border-radius:15px;margin-top:12px}</style></head><body><main><h1>🚗 Jeux en voiture</h1><div class="card"><div id="scores" class="scores"></div><button id="reset" class="reset">🔄 Nouvelle partie · scores à 0</button></div><div class="card"><div class="tag">Qui joue ?</div><div id="players" class="players"></div></div><div class="card"><div id="type" class="tag"></div><p id="challenge" class="q"></p><div class="grid"><button id="ok">✅ Réussi</button><button id="next" class="alt">⏭️ Passer</button></div><div id="success" class="success"></div></div><div class="grid"><button id="spot">👀 Premier qui voit…</button><button id="words" class="alt">🧠 Jeu de mots</button></div><a class="back" href="jeux.html">← Jeux en famille</a><p class="small">Jeu destiné aux passagers. Le conducteur ne doit pas manipuler le téléphone ni participer à des défis qui détournent son attention de la conduite.</p></main><script>const challenges=[['Cite 5 marques de voitures en 10 secondes.',2,'Rapidité'],['Premier qui voit une voiture rouge.',2,'Observation'],['Trouve une plaque avec deux chiffres identiques.',2,'Observation'],['Cite 5 villes françaises.',2,'Culture'],['Trouve un véhicule plus grand que votre voiture.',1,'Observation'],['Cite 5 animaux commençant par la même lettre.',2,'Mots'],['Premier qui voit un panneau rond.',1,'Observation'],['Fais deviner un animal en 3 indices.',2,'Devinette'],['Cite 4 pays d’Europe en 10 secondes.',2,'Culture'],['Trouve une voiture blanche puis une noire.',2,'Observation'],['Invente une histoire avec route, dragon et glace.',2,'Créatif'],['Cite 6 prénoms en 15 secondes.',2,'Rapidité'],['Premier qui voit un camion.',1,'Observation'],['Trouve un mot qui rime avec voiture.',2,'Mots'],['Fais deviner un film en 3 indices.',2,'Culture'],['Cite 5 aliments qu’on peut manger froids.',2,'Mots'],['Premier qui voit un panneau avec une ville.',1,'Observation'],['Trouve une voiture dont la marque commence par R, P, F ou C.',2,'Observation'],['Cite 5 choses qu’on emporte en vacances.',2,'Rapidité'],['Donne 3 mots anglais liés au voyage.',2,'Anglais'],['Premier qui voit une moto.',1,'Observation'],['Fais deviner un métier sans dire où il travaille.',2,'Devinette'],['Cite 5 sports en 10 secondes.',2,'Rapidité'],['Trouve une plaque contenant le chiffre 7.',2,'Observation'],['Invente un nom drôle pour une station-service.',2,'Créatif'],['Cite 5 animaux marins.',2,'Culture'],['Premier qui voit un pont.',2,'Observation'],['Trouve trois choses bleues visibles depuis la voiture.',2,'Observation'],['Cite 4 capitales européennes.',3,'Culture'],['Fais une phrase avec 5 mots commençant par la même lettre.',3,'Mots'],['Premier qui voit un vélo.',1,'Observation'],['Cite 5 métiers en moins de 12 secondes.',2,'Rapidité'],['Trouve une voiture avec des barres de toit.',2,'Observation'],['Fais deviner un personnage célèbre en 3 indices.',3,'Culture'],['Cite 5 fruits sans dire pomme ni banane.',2,'Rapidité'],['Premier qui voit un panneau triangulaire.',1,'Observation'],['Invente une publicité pour votre voiture.',2,'Créatif'],['Trouve une plaque dont la somme des deux premiers chiffres dépasse 10.',3,'Observation'],['Cite 5 pays dont le nom contient la lettre A.',3,'Culture'],['Fais deviner un objet de la voiture.',2,'Devinette'],['Premier qui voit une caravane ou un camping-car.',2,'Observation'],['Cite 6 mots commençant par S.',2,'Mots'],['Trouve un véhicule avec un logo que tu reconnais.',1,'Observation'],['Cite 5 desserts.',2,'Rapidité'],['Fais une devinette aux autres joueurs.',2,'Devinette'],['Premier qui voit un panneau bleu.',1,'Observation'],['Cite 5 choses qui roulent.',2,'Mots'],['Trouve une voiture avec une couleur rare.',2,'Observation'],['Cite 4 animaux à quatre pattes.',1,'Rapidité'],['Imagine le métier du conducteur de la prochaine voiture que vous dépassez, sans jugement ni moquerie.',1,'Créatif'],['Premier qui voit une station-service.',1,'Observation'],['Cite 5 mots qui commencent et finissent par une voyelle.',3,'Mots'],['Trouve une plaque avec un zéro.',2,'Observation'],['Cite 5 chansons ou artistes connus.',2,'Musique'],['Fais deviner une chanson en la fredonnant.',2,'Musique'],['Premier qui voit un bus.',1,'Observation'],['Cite 5 objets présents dans une cuisine.',2,'Rapidité'],['Trouve un panneau avec un nombre supérieur à 50.',2,'Observation'],['Cite 4 pays voisins de la France.',3,'Culture'],['Invente un slogan de vacances en 10 secondes.',2,'Créatif'],['Premier qui voit un rond-point.',1,'Observation'],['Cite 5 animaux qui peuvent voler.',2,'Culture'],['Trouve trois lettres différentes sur une plaque.',1,'Observation'],['Fais deviner une ville française en 3 indices.',3,'Culture'],['Cite 5 choses jaunes.',2,'Mots'],['Premier qui voit un véhicule utilitaire.',1,'Observation'],['Trouve une voiture plus ancienne en apparence que la vôtre.',1,'Observation'],['Cite 5 personnages de dessins animés.',2,'Culture'],['Donne 3 synonymes ou mots proches de rapide.',2,'Mots'],['Premier qui voit un tunnel.',2,'Observation'],['Cite 5 mots anglais faciles.',1,'Anglais'],['Trouve un panneau indiquant une direction.',1,'Observation'],['Fais deviner un sport en 3 indices.',2,'Devinette'],['Cite 5 légumes.',2,'Rapidité'],['Premier qui voit des vaches, moutons ou chevaux.',2,'Observation'],['Trouve une plaque contenant deux voyelles.',2,'Observation'],['Cite 5 pays d’Asie.',3,'Culture'],['Invente le nom d’une voiture du futur.',2,'Créatif'],['Premier qui voit un véhicule vert.',2,'Observation'],['Cite 6 choses que l’on trouve dans une maison.',2,'Rapidité'],['Trouve un panneau avec une flèche.',1,'Observation'],['Fais deviner un animal sans dire sa couleur ni son habitat.',3,'Devinette'],['Cite 5 choses qui commencent par T.',2,'Mots'],['Premier qui voit une voiture avec une remorque.',2,'Observation'],['Trouve une plaque dont le dernier chiffre est pair.',1,'Observation'],['Cite 5 films ou dessins animés.',2,'Culture'],['Invente une phrase drôle avec trois mots choisis par les autres.',3,'Créatif'],['Premier qui voit une aire de repos.',1,'Observation'],['Cite 4 océans ou mers.',3,'Culture'],['Trouve un véhicule avec quatre portes visibles.',1,'Observation'],['Fais deviner un aliment en 3 indices.',2,'Devinette'],['Cite 5 mots liés à l’été.',2,'Mots'],['Premier qui voit un panneau de limitation de vitesse.',1,'Observation'],['Trouve une voiture de la même marque que la vôtre.',2,'Observation'],['Cite 5 capitales.',3,'Culture'],['Fais une chaîne de mots : chaque mot doit commencer par la dernière lettre du précédent. Réussis-en 5.',3,'Mots'],['Premier qui voit une voiture jaune.',3,'Observation'],['Trouve un panneau contenant la lettre A.',1,'Observation'],['Cite 5 animaux de la ferme.',2,'Culture'],['Fais deviner un objet sans dire à quoi il sert.',3,'Devinette'],['Premier qui voit un toit rouge.',1,'Observation'],['Cite 5 choses qu’on peut boire.',1,'Rapidité'],['Trouve trois véhicules de trois couleurs différentes.',3,'Observation'],['Invente un nouveau panneau routier amusant et explique sa signification.',2,'Créatif'],['Cite 5 mots qui contiennent la lettre R.',2,'Mots'],['Premier qui voit un drapeau.',2,'Observation'],['Trouve un numéro de département ou un nombre à deux chiffres sur un panneau.',2,'Observation'],['Cite 5 métiers qui utilisent un véhicule.',3,'Culture'],['Fais deviner un pays en donnant sa capitale ou un monument.',3,'Culture'],['Premier qui voit une église, un château ou un monument.',2,'Observation'],['Cite 5 choses que l’on peut trouver dans un sac.',2,'Rapidité'],['Trouve une plaque avec une lettre répétée.',2,'Observation'],['Invente une chanson de 10 secondes sur le voyage.',2,'Musique'],['Cite 5 objets qui fonctionnent avec de l’électricité.',2,'Culture'],['Premier qui voit une voiture avec un coffre de toit.',2,'Observation'],['Trouve un mot de 8 lettres ou plus sur un panneau.',3,'Observation'],['Cite 5 choses que l’on trouve à la plage.',2,'Rapidité'],['Fais deviner un super-héros en 3 indices.',2,'Culture'],['Premier qui voit un panneau indiquant une distance.',1,'Observation'],['Cite 5 mots commençant par M.',2,'Mots'],['Trouve un véhicule avec plus de 4 roues.',2,'Observation'],['Invente une destination de vacances imaginaire et décris-la en 20 secondes.',3,'Créatif']];let state=JSON.parse(localStorage.getItem('plage4')||'null')||{players:[{name:'Joueur 1',score:0},{name:'Joueur 2',score:0},{name:'Joueur 3',score:0},{name:'Joueur 4',score:0}]};state.players=state.players.slice(0,4);let selected=0,current=null,locked=false;function save(){localStorage.setItem('plage4',JSON.stringify(state));renderScores()}function renderScores(){scores.innerHTML=state.players.map((p,i)=>'<div class="scorebox"><b>'+['🥇','🥈','🥉','🏅'][i]+' '+p.name+'</b><span class="score">'+(p.score||0)+'</span></div>').join('')}function renderPlayers(){players.innerHTML='';state.players.forEach((p,i)=>{let b=document.createElement('button');b.className='player '+(i===selected?'sel':'');b.textContent=p.name;b.onclick=()=>{selected=i;renderPlayers();newChallenge()};players.appendChild(b)})}function choose(filter){let pool=filter?challenges.filter(x=>x[2]===filter):challenges;if(!pool.length)pool=challenges;current=pool[Math.floor(Math.random()*pool.length)];locked=false;ok.disabled=false;success.style.display='none';challenge.textContent=current[0];type.textContent=state.players[selected].name+' · '+current[2]+' · +'+current[1]+' point'+(current[1]>1?'s':'')}function newChallenge(){choose()}ok.onclick=()=>{if(locked)return;locked=true;ok.disabled=true;state.players[selected].score=(state.players[selected].score||0)+current[1];save();success.textContent='✅ '+state.players[selected].name+' +'+current[1]+' · Total '+state.players[selected].score;success.style.display='block';if(navigator.vibrate)navigator.vibrate(80);setTimeout(()=>{selected=(selected+1)%state.players.length;renderPlayers();newChallenge()},1400)};next.onclick=()=>{selected=(selected+1)%state.players.length;renderPlayers();newChallenge()};spot.onclick=()=>choose('Observation');words.onclick=()=>choose('Mots');reset.onclick=()=>{if(confirm('Remettre tous les scores à 0 ?')){state.players.forEach(p=>p.score=0);save();newChallenge()}};renderPlayers();renderScores();newChallenge();</script></body></html>
