<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7b2cbf"><title>Défi Apéro</title><style>:root{font-family:system-ui,sans-serif;color:#231;background:linear-gradient(160deg,#ffe3a3,#ffb4a2,#cdb4db);min-height:100%}*{box-sizing:border-box}body{margin:0;min-height:100vh}main{max-width:560px;margin:auto;padding:16px}.card{background:#fff;border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 8px 24px #0002}h1{text-align:center;margin:2px 0 12px}.players,.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.player{background:#f6efff;color:#321;border:2px solid #d9c2f0}.player.sel{background:#7b2cbf;color:#fff}.scores{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.scorebox{background:#fff8df;border-radius:15px;padding:10px;text-align:center}.scorebox b{display:block}.score{font-size:28px;font-weight:900}button{font:inherit;border:0;border-radius:16px;padding:14px;min-height:52px;font-weight:800;background:#7b2cbf;color:#fff}button.alt{background:#ff9f1c;color:#321}.q{font-size:22px;font-weight:850}.tag{font-weight:800;color:#7b2cbf}.success{display:none;background:#d9f7df;border:2px solid #62bd73;border-radius:18px;padding:14px;text-align:center;font-size:20px;font-weight:900;margin-top:12px}.small{font-size:13px;color:#654}.top{display:flex;gap:8px}.top button{flex:1}</style></head><body><main><h1>🥨 Défi Apéro</h1><div class="card"><div id="scores" class="scores"></div></div><div class="card"><div class="tag">Qui joue ?</div><div id="players" class="players"></div></div><div class="card"><div id="type" class="tag"></div><p id="challenge" class="q"></p><div class="grid"><button id="ok">✅ Défi réussi</button><button id="next" class="alt">⏭️ Passer</button></div><div id="success" class="success"></div></div><div class="top"><button id="duel">⚔️ Duel express</button><button id="random" class="alt">🎲 Surprise</button></div><p class="small">Version familiale : aucun défi ne nécessite de boire de l’alcool. Utilisez eau, jus ou soda si un défi mentionne un verre.</p></main><script>const challenges=[['Mime un métier. Les autres ont 20 secondes pour trouver.',2,'Mime'],['Fais rire quelqu’un en moins de 15 secondes sans le toucher.',2,'Rire'],['Cite 5 fruits en moins de 10 secondes.',1,'Rapidité'],['Invente une publicité de 15 secondes pour les chips.',2,'Créatif'],['Fais deviner un film uniquement avec des gestes.',2,'Mime'],['Dis l’alphabet à l’envers le plus loin possible pendant 15 secondes.',3,'Cerveau'],['Trouve 6 mots commençant par la lettre P en 20 secondes.',2,'Rapidité'],['Imite une personne connue sans donner son nom.',2,'Mime'],['Fais une tour avec 5 objets de table sans qu’elle tombe.',3,'Adresse'],['Raconte une histoire qui contient les mots plage, pizza et licorne.',2,'Créatif'],['Tiens une serviette ou un dessous de verre en équilibre sur ta tête 20 secondes.',2,'Adresse'],['Cite 4 pays d’Europe en 10 secondes.',2,'Culture'],['Fais deviner un animal avec seulement des bruits.',2,'Mime'],['Donne 3 mots qui riment avec bateau.',2,'Mots'],['Fais une pose de statue. Les autres ont 20 secondes pour te faire rire sans te toucher.',3,'Rire'],['Cite 5 choses qu’on trouve dans une cuisine.',1,'Rapidité'],['Invente un slogan pour votre famille.',2,'Créatif'],['Fais 3 expressions faciales : surpris, fâché, très heureux.',1,'Mime'],['Récite les mois de l’année le plus vite possible sans erreur.',2,'Rapidité'],['Fais deviner un sport sans parler.',2,'Mime'],['Choisis un joueur : pierre-feuille-ciseaux en 3 manches.',2,'Duel'],['Cite 5 animaux marins en 15 secondes.',2,'Culture'],['Fais passer un glaçon imaginaire de main en main en exagérant le froid.',1,'Mime'],['Invente un nouveau goût de chips et vends-le aux autres.',2,'Créatif'],['Cite 5 prénoms commençant par la même lettre.',2,'Mots'],['Fais tenir une cuillère sur ton nez 5 secondes.',3,'Adresse'],['Parle pendant 20 secondes sans utiliser le mot « je ».',3,'Cerveau'],['Fais deviner un dessin animé en 3 indices.',2,'Culture'],['Cite 4 choses de couleur rouge en moins de 10 secondes.',1,'Rapidité'],['Imite un serveur très pressé.',2,'Mime'],['Donne une réponse fausse mais crédible à la question : pourquoi le ciel est bleu ?',2,'Créatif'],['Fais 10 petites passes avec une serviette roulée ou une balle légère avec un autre joueur.',2,'Adresse'],['Cite 5 villes françaises.',2,'Culture'],['Fais deviner un objet présent autour de vous sans le montrer.',2,'Observation'],['Dis trois compliments différents à trois joueurs.',2,'Sympa'],['Fais une mini-chorégraphie de 10 secondes que les autres doivent copier.',3,'Danse'],['Trouve 4 aliments qui commencent par la même lettre.',2,'Mots'],['Réponds à 3 questions des autres sans dire oui ni non.',3,'Piège'],['Fais une voix de dessin animé pendant 20 secondes.',2,'Mime'],['Invente un toast familial de 10 secondes avec ton verre, même s’il contient de l’eau.',1,'Ambiance'],['Cite 5 choses qu’on emporte en vacances.',2,'Rapidité'],['Fais deviner une chanson en la fredonnant sans paroles.',2,'Musique'],['Raconte une blague. +2 si quelqu’un rit.',2,'Rire'],['Cite 4 marques de voitures en 10 secondes.',2,'Culture'],['Fais un compliment complètement exagéré à la personne de ton choix.',2,'Rire'],['Mime une scène de vacances catastrophiques.',3,'Mime'],['Invente un cocktail sans alcool avec 3 ingrédients.',2,'Créatif'],['Cite 5 métiers en moins de 12 secondes.',2,'Rapidité'],['Fais un bruit d’animal : le premier qui trouve gagne aussi 1 point.',2,'Duel'],['Donne 3 mots anglais liés aux vacances.',2,'Anglais'],['Fais le meilleur rire de méchant de film.',2,'Rire'],['Cite 5 objets qui tiennent dans une poche.',2,'Observation'],['Fais deviner une célébrité en 3 indices sans dire son métier.',3,'Culture'],['Invente un nom de restaurant familial complètement absurde.',2,'Créatif'],['Épelle ton prénom à l’envers sans te tromper.',2,'Cerveau'],['Fais 5 secondes de danse de victoire.',1,'Danse'],['Choisis quelqu’un : chacun cite à tour de rôle un animal. Le premier qui bloque perd.',3,'Duel'],['Cite 6 aliments en 15 secondes sans dire fruit ni légume.',2,'Rapidité'],['Fais deviner un objet en le décrivant sans utiliser sa couleur.',2,'Mots'],['Parle comme un robot pendant 20 secondes.',1,'Mime'],['Trouve 3 choses autour de toi qui commencent par la même lettre.',2,'Observation']];let state=JSON.parse(localStorage.getItem('plage4')||'null')||{players:[{name:'Joueur 1',score:0},{name:'Joueur 2',score:0},{name:'Joueur 3',score:0},{name:'Joueur 4',score:0}]};state.players=state.players.slice(0,4);while(state.players.length<1)state.players.push({name:'Joueur 1',score:0});let selected=0,current=null,locked=false;function save(){localStorage.setItem('plage4',JSON.stringify(state));renderScores()}function renderPlayers(){players.innerHTML='';state.players.forEach((p,i)=>{let b=document.createElement('button');b.className='player '+(i===selected?'sel':'');b.textContent=p.name;b.onclick=()=>{selected=i;renderPlayers();newChallenge()};players.appendChild(b)})}function renderScores(){scores.innerHTML=state.players.map((p,i)=>'<div class="scorebox"><b>'+['🥇','🥈','🥉','🏅'][i]+' '+p.name+'</b><span class="score">'+(p.score||0)+'</span></div>').join('')}function newChallenge(){locked=false;success.style.display='none';current=challenges[Math.floor(Math.random()*challenges.length)];challenge.textContent=current[0];type.textContent=state.players[selected].name+' · '+current[2]+' · +'+current[1]+' point'+(current[1]>1?'s':'');ok.disabled=false}ok.onclick=()=>{if(locked)return;locked=true;ok.disabled=true;state.players[selected].score=(state.players[selected].score||0)+current[1];save();success.textContent='✅ '+state.players[selected].name+' réussit ! +'+current[1]+' points · Total : '+state.players[selected].score;success.style.display='block';if(navigator.vibrate)navigator.vibrate([80,40,80]);setTimeout(newChallenge,1400)};next.onclick=newChallenge;duel.onclick=()=>{if(state.players.length<2)return;let a=Math.floor(Math.random()*state.players.length),b=a;while(b===a)b=Math.floor(Math.random()*state.players.length);selected=a;renderPlayers();current=['DUEL : '+state.players[a].name+' contre '+state.players[b].name+' — pierre-feuille-ciseaux, premier à 2 victoires.',2,'Duel'];challenge.textContent=current[0];type.textContent='⚔️ Duel express · +2 points au gagnant';success.style.display='none';locked=false;ok.disabled=false};random.onclick=()=>{selected=Math.floor(Math.random()*state.players.length);renderPlayers();newChallenge()};renderPlayers();renderScores();newChallenge();</script></body></html>
