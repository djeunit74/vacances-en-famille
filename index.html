<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11a7c4"><title>Vacances en Famille</title><style>:root{font-family:system-ui,sans-serif;color:#123;background:linear-gradient(#bdefff,#ffe7a7);min-height:100%}*{box-sizing:border-box}body{margin:0;min-height:100vh}main{max-width:560px;margin:auto;padding:16px 14px 90px}h1{text-align:center;margin:4px 0 12px}.card{background:#fff;border-radius:20px;padding:15px;margin:10px 0;box-shadow:0 8px 22px #1262}button,input{font:inherit}button{border:0;border-radius:15px;padding:13px;font-weight:800;min-height:50px;background:#11a7c4;color:white}.alt{background:#ffbd3d;color:#432}.danger{background:#d94f4f}.grid,.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}.player{background:#eefbff;color:#123;border:2px solid #b8e8f2}.player.sel{background:#11a7c4;color:white}.nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:center;gap:4px;padding:7px}.nav button{font-size:11px;padding:8px;min-height:42px}.hide{display:none}.q{font-size:20px;font-weight:800}.ans{width:100%;margin:5px 0;background:#edf8fa;color:#123;border:2px solid #b8e8f2}.good{background:#3fb66c!important;color:white}.bad{background:#e95b5b!important;color:white}.score{font-size:30px;font-weight:900}.tag{font-weight:800;color:#07829a}input{width:100%;padding:10px;border:2px solid #b8e8f2;border-radius:12px;margin:4px 0}small{color:#567}</style></head><body><main><h1>🌴 Vacances en Famille</h1><section id="home"><div class="card"><b id="who"></b><p>Total : <b id="total">0</b> points</p></div><div class="grid"><button data-go="quiz">❓ Quiz</button><button class="alt" data-go="pool">🏊 Piscine</button><button data-go="beach">🏖️ Plage</button><button class="alt" data-go="random">🎲 Surprise</button><button data-go="duel">⚔️ Duel</button><button class="alt" data-go="scores">🏆 Scores</button></div></section><section id="quiz" class="hide"><div class="card"><div id="quizPlayers" class="players"></div><div id="level" class="tag"></div><p id="question" class="q"></p><div id="answers"></div><p id="msg"></p><button class="alt" id="next">Question suivante</button></div></section><section id="pool" class="hide"><div class="card"><h2>🏊 Piscine</h2><div id="poolPlayers" class="players"></div><p id="poolText" class="q"></p><div class="grid"><button id="poolOk">Réussi</button><button class="alt" id="poolNext">Autre défi</button></div><p><small>Zone adaptée au niveau de chacun. Pas de concours d’apnée.</small></p></div></section><section id="beach" class="hide"><div class="card"><h2>🏖️ Plage</h2><div id="beachPlayers" class="players"></div><p id="beachText" class="q"></p><div class="grid"><button id="beachOk">Réussi</button><button class="alt" id="beachNext">Autre défi</button></div></div></section><section id="random" class="hide"><div class="card" style="text-align:center"><p id="randomText" class="q">Prêt ?</p><button id="draw">Lancer</button></div></section><section id="duel" class="hide"><div class="card"><h2>⚔️ Duel</h2><p id="duelText" class="q"></p><div id="duelBtns" class="grid"></div><button class="alt" id="duelNext">Nouveau duel</button></div></section><section id="scores" class="hide"><div id="scoreList"></div><button class="danger" id="reset">Scores à zéro</button></section><section id="settings" class="hide"><div class="card"><h2>Joueurs (1 à 4)</h2><div id="settingsList"></div><button id="add">+ Ajouter</button></div></section></main><nav class="nav"><button data-go="home">Accueil</button><button data-go="quiz">Quiz</button><button data-go="pool">Piscine</button><button data-go="scores">Scores</button><button data-go="settings">Réglages</button></nav><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let state=JSON.parse(localStorage.getItem('vacfam')||'null')||{players:[{name:'Papa',age:40,score:0,ok:0,total:0,streak:0},{name:'Joueur 2',age:11,score:0,ok:0,total:0,streak:0},{name:'Joueur 3',age:15,score:0,ok:0,total:0,streak:0},{name:'Joueur 4',age:11,score:0,ok:0,total:0,streak:0}]};let sel=0,currentQ=null,currentPts=1,currentTask=null;
state.players.forEach((p,i)=>{p.age??=(i?11:40);p.score??=0;p.ok??=0;p.total??=0;p.streak??=0});const save=()=>{localStorage.setItem('vacfam',JSON.stringify(state));render()};
const Q=[
['Quel est le plus grand océan ?',['Atlantique','Pacifique','Indien'],1,8,99,1],['Le dauphin est un…',['Poisson','Mammifère','Reptile'],1,8,13,1],['Combien font 7 × 8 ?',['54','56','64'],1,8,12,1],['Quelle est la capitale de la France ?',['Paris','Lyon','Nice'],0,8,12,1],['Quel mot anglais signifie plage ?',['Beach','Street','Hill'],0,8,13,1],['Combien de pattes a une araignée ?',['6','8','10'],1,8,12,1],['Quelle planète est rouge ?',['Mars','Vénus','Jupiter'],0,8,13,1],['Quel animal fabrique du miel ?',['Abeille','Mouche','Papillon'],0,8,12,1],['Combien font 25 + 37 ?',['52','62','72'],1,9,13,1],['Quelle est la moitié de 86 ?',['42','43','46'],1,10,13,2],['Quelle chaîne sépare en partie France et Espagne ?',['Alpes','Pyrénées','Vosges'],1,10,13,2],['Quel fleuve traverse Paris ?',['Seine','Loire','Rhône'],0,10,13,2],['Quel est le carré de 12 ?',['124','144','164'],1,11,14,2],['Quel gaz est majoritaire dans l’atmosphère ?',['Oxygène','Azote','CO₂'],1,11,15,2],['En anglais, prétérit de go ?',['Goed','Went','Gone'],1,12,16,2],['En quelle année débute la Révolution française ?',['1492','1789','1914'],1,11,15,2],['Combien font 18 % de 250 ?',['35','45','55'],1,14,99,3],['Quelle est la racine carrée de 196 ?',['12','14','16'],1,14,99,3],['Quelle unité mesure l’intensité électrique ?',['Ampère','Volt','Ohm'],0,14,99,3],['Quel est le pH d’une solution neutre environ ?',['0','7','14'],1,14,99,3],['72 km/h valent combien en m/s ?',['10','20','30'],1,14,99,3],['Quelle est la capitale de la Turquie ?',['Istanbul','Ankara','Izmir'],1,14,99,3],['Quel élément a pour symbole Fe ?',['Fer','Fluor','Francium'],0,14,99,3],['Qui a écrit Le Petit Prince ?',['Saint-Exupéry','Hugo','Molière'],0,11,16,2],['Quelle est la capitale de la Norvège ?',['Oslo','Stockholm','Helsinki'],0,13,99,3],['Quelle est la capitale de la Slovénie ?',['Ljubljana','Bratislava','Zagreb'],0,18,99,3],['Qui a peint Guernica ?',['Picasso','Dalí','Monet'],0,18,99,3],['Loi d’Ohm ?',['U = R × I','P = U / I','R = U × I'],0,16,99,3],['Qui a écrit 1984 ?',['George Orwell','Aldous Huxley','Hemingway'],0,16,99,3],['Quelle unité mesure la fréquence ?',['Hertz','Joule','Pascal'],0,16,99,3],['Quel organe produit l’insuline ?',['Pancréas','Foie','Rate'],0,15,99,3],['Combien de bits dans un octet ?',['4','8','16'],1,13,99,3],['Quel détroit sépare Espagne et Maroc ?',['Gibraltar','Béring','Malacca'],0,13,99,3],['Quel est le plus petit nombre premier ?',['1','2','3'],1,10,99,2],['Combien de mois ont 28 jours ?',['1','6','12'],2,9,99,2],['1 kg de plumes ou 1 kg de sable : lequel est plus lourd ?',['Plumes','Sable','Même poids'],2,8,99,1],['Un coq pond-il des œufs ?',['Oui','Non','Seulement l’été'],1,8,99,1],['Tu dépasses le deuxième d’une course. Tu es…',['Premier','Deuxième','Troisième'],1,9,99,2],['Quel mois a au moins 28 jours ?',['Février seulement','Tous','Janvier seulement'],1,8,99,1],['Quel mot anglais signifie toujours ?',['Never','Always','Sometimes'],1,11,15,2],['Quel est 30 % de 90 ?',['18','27','30'],1,13,17,2],['2⁵ vaut…',['10','25','32'],2,12,17,2],['Quelle est la moyenne de 10, 12 et 14 ?',['11','12','13'],1,12,17,2],['Quel scientifique est associé à l’évolution ?',['Darwin','Newton','Pasteur'],0,12,17,2],['Quelle molécule porte l’information génétique ?',['ADN','ATP','H₂O'],0,13,99,3],['Quel métal a pour symbole Cu ?',['Cuivre','Cobalt','Chrome'],0,15,99,3],['Qui a composé Les Quatre Saisons ?',['Vivaldi','Mozart','Chopin'],0,15,99,3],['Quelle est la capitale de la Hongrie ?',['Budapest','Bucarest','Belgrade'],0,15,99,3],['37 × 24 = ?',['868','888','908'],1,18,99,3],['Quelle est la capitale de l’Estonie ?',['Tallinn','Riga','Vilnius'],0,18,99,3],['Quel auteur a écrit L’Étranger ?',['Camus','Zola','Proust'],0,18,99,3],['Quelle est la capitale de la Croatie ?',['Zagreb','Split','Dubrovnik'],0,18,99,3],['Quel est le symbole de la résistance électrique ?',['Ω','A','W'],0,16,99,3],['Quelle est la capitale de la Lituanie ?',['Vilnius','Riga','Tallinn'],0,18,99,3],['Qui a écrit Madame Bovary ?',['Flaubert','Balzac','Zola'],0,18,99,3],['Quelle unité SI mesure la pression ?',['Pascal','Newton','Tesla'],0,17,99,3],['Quel est 3⁴ ?',['27','64','81'],2,15,99,3],['Quelle est la capitale de la Roumanie ?',['Bucarest','Budapest','Belgrade'],0,18,99,3],['Quel gaz a pour formule CH₄ ?',['Méthane','Ozone','Ammoniac'],0,15,99,3],['Qui a composé La Flûte enchantée ?',['Mozart','Beethoven','Bach'],0,16,99,3]
];
const pool=[['Fais 10 passes avec un autre joueur.',2],['Invente une danse aquatique de 15 secondes.',2],['Fais une statue dans l’eau 10 secondes.',1],['Fais 10 montées de genoux dans l’eau.',1],['Course de lenteur en marchant : dernier arrivé gagne.',3],['Fais une chorégraphie de 3 mouvements à copier.',2],['Fais avancer un ballon en soufflant dessus.',2],['Imite un dauphin sans mettre la tête sous l’eau.',1],['Fais 5 passes avec chaque joueur.',3],['Inventez un cri d’équipe piscine.',2],['Mime un animal, les autres devinent.',2],['Fais 15 secondes de danse synchronisée avec un joueur.',3],['Marche comme un crabe dans une zone où tu as pied.',2],['Fais 6 passes avec une seule main.',2],['Meilleure grimace de monstre marin.',2],['Suite de 4 gestes à reproduire.',2],['Fais passer le ballon à tous sans qu’il touche l’eau.',3],['Marche de robot aquatique 15 secondes.',2],['Trouve 4 couleurs différentes autour de toi.',1],['Pierre-feuille-ciseaux en 3 manches.',2]];
const beach=[['Construis un château avec 3 tours.',2],['Trouve 3 coquillages différents.',1],['Marche comme un crabe sur 10 mètres.',2],['Écris ton prénom géant dans le sable.',1],['Invente un cri de ralliement familial.',2],['Dessine un animal marin dans le sable.',2],['Fais une statue 30 secondes sans rire.',2],['Crée une carte au trésor dans le sable.',2],['Fais deviner un animal sans parler.',2],['Construis la plus haute tour de sable en 2 minutes.',3],['Invente une histoire de pirate en 30 secondes.',2],['Dessine un monstre marin géant.',2],['Mime un métier jusqu’à ce que quelqu’un trouve.',2],['Fais rire un joueur en moins de 20 secondes.',2],['Invente un nouveau sport de plage.',3]];
const duels=['Pierre-feuille-ciseaux : premier à 2 victoires.','Qui tient le plus longtemps sur un pied ?','Meilleure imitation de mouette : vote des autres.','Plus haute tour de sable en 60 secondes.','Premier à réussir 10 passes de ballon.','Meilleur cri de pirate : vote familial.'];
function players(el,cb){el.innerHTML='';state.players.forEach((p,i)=>{let b=document.createElement('button');b.className='player '+(i===sel?'sel':'');b.textContent=p.name;b.onclick=()=>{sel=i;render();cb&&cb()};el.appendChild(b)})}
function render(){ $('#who').textContent=state.players.map(p=>p.name).join(' · ');$('#total').textContent=state.players.reduce((a,p)=>a+p.score,0);players($('#quizPlayers'));players($('#poolPlayers'),newPool);players($('#beachPlayers'),newBeach);$('#scoreList').innerHTML=[...state.players].sort((a,b)=>b.score-a.score).map((p,i)=>`<div class="card"><b>${['🥇','🥈','🥉','🏅'][i]} ${p.name}</b><div class="score">${p.score}</div><small>${p.ok}/${p.total} bonnes réponses quiz</small></div>`).join('');$('#settingsList').innerHTML=state.players.map((p,i)=>`<div class="card"><input value="${p.name.replaceAll('"','&quot;')}" onchange="renameP(${i},this.value)"><label>Âge</label><input type="number" min="6" max="99" value="${p.age}" onchange="ageP(${i},this.value)">${state.players.length>1?`<button class="danger" onclick="removeP(${i})">Retirer</button>`:''}</div>`).join('')}
function difficulty(p){let d=p.age<=11?1:p.age<=15?2:3;if(p.total>=4){let r=p.ok/p.total;if(p.streak>=3||r>.8)d=Math.min(3,d+1);if(r<.45)d=Math.max(1,d-1)}return d}
function newQuiz(){let p=state.players[sel],d=difficulty(p),poolQ=Q.filter(q=>p.age>=q[3]&&p.age<=q[4]&&Math.abs(q[5]-d)<=0);if(!poolQ.length)poolQ=Q.filter(q=>p.age>=q[3]&&p.age<=q[4]);currentQ=poolQ[Math.floor(Math.random()*poolQ.length)]||Q[0];currentPts=currentQ[5];$('#level').textContent=`${p.name} · ${p.age} ans · ${['Facile','Moyen','Difficile'][currentPts-1]}`;$('#question').textContent=currentQ[0];$('#msg').textContent='';let box=$('#answers');box.innerHTML='';currentQ[1].forEach((a,i)=>{let b=document.createElement('button');b.className='ans';b.textContent=a;b.onclick=()=>answer(i,b);box.appendChild(b)});players($('#quizPlayers'),newQuiz)}
function answer(i,b){let p=state.players[sel];$$('#answers button').forEach((x,j)=>{x.disabled=true;if(j===currentQ[2])x.classList.add('good')});p.total++;if(i===currentQ[2]){p.ok++;p.streak++;p.score+=currentPts;$('#msg').textContent=`Bravo ! +${currentPts} point${currentPts>1?'s':''}`}else{p.streak=0;b.classList.add('bad');$('#msg').textContent='Raté ! La difficulté s’adaptera.'}save()}
function task(arr,text){currentTask=arr[Math.floor(Math.random()*arr.length)];$(text).textContent=currentTask[0]+'  (+'+currentTask[1]+')'}function newPool(){task(pool,'#poolText')}function newBeach(){task(beach,'#beachText')}function taskOk(){state.players[sel].score+=currentTask[1];save()}
function newDuel(){if(state.players.length<2){$('#duelText').textContent='Ajoute au moins 2 joueurs.';return}let a=Math.floor(Math.random()*state.players.length),b=a;while(b===a)b=Math.floor(Math.random()*state.players.length);$('#duelText').textContent=state.players[a].name+' VS '+state.players[b].name+' — '+duels[Math.floor(Math.random()*duels.length)];$('#duelBtns').innerHTML='';[a,b].forEach(i=>{let bt=document.createElement('button');bt.textContent='Victoire '+state.players[i].name+' (+2)';bt.onclick=()=>{state.players[i].score+=2;save();$('#duelBtns').innerHTML='';$('#duelText').textContent='🏆 '+state.players[i].name+' gagne !'};$('#duelBtns').appendChild(bt)})}
function go(id){$$('main section').forEach(x=>x.classList.add('hide'));$('#'+id).classList.remove('hide');render();if(id==='quiz')newQuiz();if(id==='pool')newPool();if(id==='beach')newBeach();if(id==='duel')newDuel()}
$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));$('#next').onclick=newQuiz;$('#poolNext').onclick=newPool;$('#beachNext').onclick=newBeach;$('#poolOk').onclick=taskOk;$('#beachOk').onclick=taskOk;$('#duelNext').onclick=newDuel;$('#draw').onclick=()=>{let p=state.players[Math.floor(Math.random()*state.players.length)],arr=Math.random()<.5?pool:beach,t=arr[Math.floor(Math.random()*arr.length)];$('#randomText').textContent=p.name+' : '+t[0]+' (+'+t[1]+')'};$('#reset').onclick=()=>{if(confirm('Remettre les scores à zéro ?')){state.players.forEach(p=>p.score=0);save()}};$('#add').onclick=()=>{if(state.players.length>=4)return alert('Maximum 4 joueurs');state.players.push({name:'Joueur '+(state.players.length+1),age:11,score:0,ok:0,total:0,streak:0});save()};window.renameP=(i,v)=>{state.players[i].name=v.trim()||'Joueur '+(i+1);save()};window.ageP=(i,v)=>{state.players[i].age=Math.max(6,Math.min(99,parseInt(v)||11));save()};window.removeP=i=>{if(state.players.length<=1)return;state.players.splice(i,1);sel=Math.min(sel,state.players.length-1);save()};render();
</script></body></html>
